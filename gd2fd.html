            function setBlock(x,y,id) {
                if (x<0 || y<0 || y>56) return;
                if (id>255) {
                    if (getBlock(x,y,1)!=-1) {
                        if (spr([...range(42,63),73,74]).includes(id)) return; //low priority/deco sprites
                    };
                    const triggers = [ //shift these 10 to the right
                        15, 95,96,97,98,99, 111,112,113,114,115,116, ...range(127,245)
                    ];
                    if (triggers.includes(id-256)) x+=10;
                    const portals = spr([
                        0,1,2,3,4,8,9,16,17,18,19,23,24,25,36,75,78,79,88,95,96,97,98,99,100,102,103,104,105,106
                    ]);
                    while (portals.includes(getBlock(x,y,1)) && portals.includes(id)) x++; //make sure all portals are preserved
                    spriteGrid[y][x] = id;
                } else {
                    const replacements = { //multiple objects on same tile
                        '24,25':22,
                        '84,92':60,
                        '85,92':61,
                        '86,92':62,
                        '84,88':56,
                        '85,89':57,
                        '86,90':58,
                        '18,29':196,
                        '29,30':194,
                        '30,31':193,
                        '18,31':195,
                    };
                    if (getBlock(x,y,0)!=0) {
                        const prev = getBlock(x,y,0);
                        const string = prev>id?`${id},${prev}`:`${prev},${id}`;
                        const priority = [0, 128, 23,24,92,93,94,95, 12,13,14,15, 132,133,134,135];
                        if (replacements[string]!=undefined) {id = replacements[string]}
                        else if (priority.includes(id)) {
                            if (priority.includes(prev)) { if (priority.indexOf(prev) > priority.indexOf(id)) return
                            } else { return }
                        };
                        if (Math.random()<0.5) return;
                    };
                    tileGrid[y][x] = id;
                };
            };
            prev = 0;
            for (const object of levelData) {
                //console.log(object);
                let block = parseInt(object[1]);
                if (object[13] && Object.keys(map).includes(`${block}!`)) block += '!';
                if (Object.keys(map).includes(`${block}`)) {
                    block = map[`${block}`];
                    if (Array.isArray(block)) {
                        let offset = 0;
                        if (object[6]) offset = parseInt(object[6]);
                        if (offset < 0) offset += 360;
                        offset = Math.floor(offset/90);
                        let hflip = false;
                        if (object[4]) hflip = !hflip;
                        if (object[5]) {offset += 2; hflip = !hflip};
                        offset %= 4;
                        if (hflip && block.length>4) offset += 4;
                        block = block[offset];
                    };

                        return newRow;
                    });
                    spriteGrid = spriteGrid.map(row => {
                        let newRow = row.slice(0, gridSize[0]);
                        while (newRow.length < gridSize[0]) newRow.push(-1);
                        return newRow;
                    });

                    };

                    };
                    highestY = Math.max(highestY, Math.floor(object[3]/30));

                };
            };

                tileGrid = tileGrid.slice(-gridSize[1]);

            };
            console.log(unassigned);
            console.log([...new Set(unassigned.map(i=>i[0]))])
            await save();
        };
